{% set name = "neper" %}
{% set version = "7.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/neperfepx/neper/archive/v{{ version }}.tar.gz
  sha256: 17fa03b5ae647a613d7c7fbd324c769061050b8835f24ea03a3b48aec9644032
  patches:
    # Gmsh workers on macOS (upstream 98fd00365 and 46d7f8fd3, in 7.0.1)
    - 0001-Fix-Gmsh-workers-on-macOS.patch

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
    # Gmsh library (libgmsh and gmshc.h), mandatory since Neper 7.0.0
    - gmsh >=4.9
    - gsl
    - scotch
  run:
    # the Gmsh library changes name (soname) at each minor version
    - {{ pin_compatible('gmsh', max_pin='x.x') }}
    - gsl
    - scotch
    # image generation (neper -V)
    - povray

test:
  commands:
    - test -f $PREFIX/bin/neper
    - test -f $PREFIX/bin/orilib
    - neper --version  # [build_platform == target_platform]
    - neper -T -n 10 -reg 1 -o n10  # [build_platform == target_platform]
    - neper -M n10.tess  # [build_platform == target_platform]
    - test -f n10.msh  # [build_platform == target_platform]
    - neper -M n10.tess -part 2 -o n10p  # [build_platform == target_platform]
    - grep -q NodePart n10p.msh  # [build_platform == target_platform]
    - neper -V n10.tess,n10.msh -print img  # [build_platform == target_platform]
    - test -f img.png  # [build_platform == target_platform]

about:
  home: https://neper.info/
  license: GPL-3.0-only
  license_family: GPL
  license_file:
    - COPYING
    - CREDITS
    - src/contrib/muparser/LICENSE
  summary: Neper is a software package for polycrystal generation and meshing.
  doc_url: https://neper.info
  dev_url: https://github.com/neperfepx/neper

extra:
  recipe-maintainers:
    - npavlovikj
    - lang-m
    - rquey
